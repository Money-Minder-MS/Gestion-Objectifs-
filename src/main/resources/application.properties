
# Nom du microservice
spring.application.name=gestion-objectif
spring.config.import=optional:configserver:http://localhost:8099


# Port du serveur
server.port=8087

# Connexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/gestion_objectif?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
springdoc.swagger-ui.path=/swagger-ui.html
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
